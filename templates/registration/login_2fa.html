{% extends "core/base.html" %}
{% block title %}Authenticator — {{ site_title }}{% endblock %}
{% block content %}
<div class="panel login-wrap">
  <div class="panel-head">Authenticator</div>
  <div class="panel-body">
    <form method="post">
      {% csrf_token %}
      {% if error %}
      <p class="alert-item error">{{ error }}</p>
      {% endif %}
      <div class="form-group">
        <label for="id_code">Authenticator or recovery code</label>
        <input type="text" name="code" id="id_code" autofocus required autocomplete="one-time-code" inputmode="numeric">
      </div>
      <button type="submit" class="btn">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
