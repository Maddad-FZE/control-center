services:
  control-center:
    build: .
    container_name: control-center
    restart: unless-stopped
    ports:
      - "8099:8099"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - CC_LOG_FILE=/app/data/logs/app.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      # Bind-mount so in-app updates persist. Data-only mounts need an image rebuild.
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/bus/usb:/host/sys/bus/usb:ro
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8099 --workers 1 --threads 2 --timeout 120"

  tick:
    build: .
    container_name: control-center-tick
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - CC_LOG_FILE=/app/data/logs/tick.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "while true; do python manage.py tick; sleep 60; done"
    depends_on:
      - control-center
