<div class="service-card-menu" data-service-id="{{ service.id }}">
  <button type="button" class="service-kebab" aria-label="Card options" aria-haspopup="true" aria-expanded="false">
    <span class="service-kebab-dot"></span>
    <span class="service-kebab-dot"></span>
    <span class="service-kebab-dot"></span>
  </button>
  <div class="service-card-dropdown" hidden role="menu">
    <a href="{% url 'service_view' service.id %}" class="service-card-dropdown__item" role="menuitem">Open in overlay</a>
    <a href="{{ service.open_href }}" class="service-card-dropdown__item" target="_blank" rel="noopener" role="menuitem">Open in a new tab</a>
    {% if service.published_hostname %}
    <a href="{{ service.lan_href }}" class="service-card-dropdown__item" target="_blank" rel="noopener" role="menuitem">Open using IP</a>
    {% endif %}
    {% if is_admin and service.container_name %}
    <button type="button" class="service-card-dropdown__item" data-action="restart" data-container="{{ service.container_name }}" role="menuitem">Restart service</button>
    {% endif %}
    {% if is_admin %}
    <button type="button" class="service-card-dropdown__item" data-action="visibility" role="menuitem">
      {% if service.is_public %}Make private{% else %}Make public{% endif %}
    </button>
    <a href="{% url 'service_edit' service.id %}" class="service-card-dropdown__item" role="menuitem">Edit card</a>
    {% if tunnel_linked %}
    {% if service.published_hostname %}
    <button type="button" class="service-card-dropdown__item" data-action="unpublish" data-hostname="{{ service.published_hostname }}" role="menuitem">Unpublish {{ service.published_hostname }}</button>
    {% else %}
    <button type="button" class="service-card-dropdown__item" data-action="publish" data-service-id="{{ service.id }}" data-name="{{ service.name }}" data-origin="{{ service.href }}" role="menuitem">Publish online</button>
    {% endif %}
    {% endif %}
    <button type="button" class="service-card-dropdown__item service-card-dropdown__item--danger" data-action="delete" role="menuitem">Delete card</button>
    {% endif %}
  </div>
</div>
